<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>用药记录</title>
  <style>
    :root { --ink:#1d3557; --sub:#667991; --line:#dbe5f2; --page:#f5f8fd; --card:#fff; --berry:#2563eb; --berry-soft:#5b8ff5; --berry-pale:#eaf2ff; --mint:#e7f1ff; --mint-ink:#2d70c6; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; } body { display:grid; place-items:center; margin:0; min-height:100vh; padding:20px; background:#e9ebf1; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; } button,input,select,textarea { font:inherit; } button { cursor:pointer; }
    .app { width:390px; height:844px; max-width:100%; max-height:calc(100vh - 40px); margin:auto; border-radius:38px; background:var(--page); overflow:auto; box-shadow:0 0 36px #26324918; scrollbar-width:none; }.app::-webkit-scrollbar { display:none; }
    .nav { position:relative; display:grid; grid-template-columns:46px 1fr 46px; align-items:center; height:88px; padding:calc(env(safe-area-inset-top) + 0px) 20px 0; border-bottom:1px solid var(--line); background:#fff; }.nav h1 { margin:0; text-align:center; font-size:24px; font-weight:750; line-height:1; letter-spacing:.01em; }.back,.more { width:35px; height:35px; border:0; border-radius:50%; background:transparent; color:var(--berry); font-size:24px; line-height:1; }.more { justify-self:end; font-weight:700; letter-spacing:2px; font-size:19px; }
    .menu { position:absolute; z-index:5; top:67px; right:18px; display:none; width:155px; padding:7px; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:0 10px 24px #28304420; }.menu.open { display:block; }.menu button { width:100%; padding:10px; border:0; border-radius:9px; background:transparent; color:#475f7a; text-align:left; font-size:13px; }.menu button:hover { background:#eff6ff; }
    main { padding:28px 28px calc(45px + env(safe-area-inset-bottom)); }.notice-card { padding:25px 24px 23px; border-radius:24px; background:linear-gradient(135deg,#1d4ed8,#2872de); color:#fff; box-shadow:0 10px 20px #1d4ed827; }.notice-card h2 { margin:0 0 12px; font-size:22px; font-weight:750; line-height:1.25; letter-spacing:.01em; }.notice-card p { margin:0; color:#e4efff; font-size:15px; font-weight:450; line-height:1.62; letter-spacing:.01em; }.entry-button { width:100%; margin-top:26px; padding:18px 14px; border:0; border-radius:18px; background:#5b8ff5; color:#fff; font-size:18px; font-weight:750; letter-spacing:.02em; }.entry-button:hover { background:#6c9df9; }
    .history-head { display:flex; align-items:center; justify-content:space-between; margin:29px 2px 20px; }.history-head h2 { margin:0; font-size:22px; font-weight:750; letter-spacing:.01em; }.count { padding:7px 12px; border-radius:11px; background:var(--berry-pale); color:var(--berry); font-size:13px; font-weight:700; }
    .history { padding:18px; border:1px solid var(--line); border-radius:23px; background:#fff; }.record-section + .record-section { margin-top:24px; padding-top:23px; border-top:1px solid var(--line); }.record-section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; }.record-section-head h3 { display:flex; align-items:center; gap:8px; margin:0; font-size:16px; font-weight:750; }.record-section-head h3::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--mint-ink); box-shadow:0 0 0 4px var(--mint); }.record-section.expired .record-section-head h3::before { background:#9aa3b1; box-shadow:0 0 0 4px #eef0f4; }.record-section-head span { color:#8993a1; font-size:12px; }.medicine-card { position:relative; margin-bottom:11px; padding:17px 17px 16px; border:1px solid var(--line); border-radius:17px; background:#fdfdff; }.medicine-card:last-child { margin-bottom:0; }.medicine-card.expired { border-color:#d7e1ed; background:#f3f6fa; opacity:1; }.medicine-card.expired h3 { color:#425b7c; }.medicine-card h3 { margin:0 0 11px; font-size:18px; font-weight:750; line-height:1.28; letter-spacing:.01em; }.details { margin:0; color:var(--sub); font-size:15px; line-height:1.48; }.details b { color:var(--ink); font-weight:700; }.note { margin:10px 0 0; color:#8b93a2; font-size:12px; line-height:1.55; }.card-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:13px; }.record-date { color:#9aa3b0; font-size:11px; }.toggle-status { border:0; border-radius:8px; padding:5px 8px; background:var(--mint); color:var(--mint-ink); font-size:11px; font-weight:700; }.expired .toggle-status { background:#eef0f4; color:#707b8b; }.delete { padding:0; border:0; background:transparent; color:#526ea1; font-size:11px; }.empty { padding:21px 0 35px; color:#8891a0; text-align:center; font-size:13px; line-height:1.6; }.empty span { display:grid; place-items:center; width:45px; height:45px; margin:0 auto 10px; border-radius:50%; background:var(--berry-pale); color:var(--berry); font-size:25px; }
    .overlay { position:fixed; inset:0; z-index:10; display:none; background:#1e243542; }.overlay.open { display:block; }.sheet { position:absolute; bottom:0; left:50%; width:390px; max-width:100%; padding:10px 25px calc(25px + env(safe-area-inset-bottom)); border-radius:27px 27px 0 0; background:#fff; box-shadow:0 -10px 35px #20263d28; transform:translateX(-50%) translateY(100%); transition:transform .25s ease; }.overlay.open .sheet { transform:translateX(-50%) translateY(0); }.handle { width:42px; height:4px; margin:0 auto 19px; border-radius:5px; background:#d9dfe8; }.sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:19px; }.sheet-head h2 { margin:0; font-size:21px; }.close { border:0; background:transparent; color:var(--berry); font-size:27px; }.field { display:block; margin-bottom:15px; color:#4e586a; font-size:13px; font-weight:700; }.field input,.field select,.field textarea { width:100%; margin-top:7px; padding:11px 12px; border:1px solid #dfe4ed; border-radius:11px; outline:0; color:var(--ink); }.field input:focus,.field select:focus,.field textarea:focus { border-color:var(--berry); box-shadow:0 0 0 3px #dceaff; }.frequency-select { display:flex; align-items:center; gap:6px; margin-top:7px; color:#63748d; font-weight:500; }.field .frequency-select select { width:auto; min-width:64px; margin:0; padding:11px 8px; text-align:center; }.two { display:grid; grid-template-columns:1fr 1fr; gap:11px; }.save { width:100%; padding:14px; border:0; border-radius:13px; background:var(--berry); color:#fff; font-weight:700; }.sheet-notice { min-height:17px; margin:10px 0 0; color:var(--berry); font-size:12px; text-align:center; }
    @media(max-width:430px) { body { display:block; padding:0; background:var(--page); }.app { width:100%; height:100dvh; max-height:none; border-radius:0; }.nav { padding-top:env(safe-area-inset-top); }.sheet { width:100%; } } @media(max-width:380px) { main { padding:22px 18px 36px; }.notice-card h2 { font-size:20px; }.medicine-card { padding:16px; } }
    /* 统一移动端文字层级：10 / 12 / 14px */
    body { font-size:12px; }.nav h1,.notice-card h2,.history-head h2,.sheet-head h2 { font-size:14px; }.back,.more,.close,.empty span { font-size:14px; }.notice-card p,.entry-button,.medicine-card h3,.details,.field input,.field select,.field textarea,.save { font-size:12px; }.menu button,.count,.record-section-head h3,.record-section-head span,.note,.record-date,.toggle-status,.delete,.empty,.field,.sheet-notice,.status { font-size:10px; }
    .duration-button { display:flex; align-items:center; justify-content:space-between; width:100%; margin-top:7px; padding:11px 12px; border:1px solid #dfe4ed; border-radius:11px; background:#fff; color:var(--ink); font-size:12px; text-align:left; }.duration-button span { color:#6685ba; }.picker-overlay { position:fixed; inset:0; z-index:20; display:none; background:#1e243542; }.picker-overlay.open { display:block; }.picker-sheet { position:absolute; bottom:0; left:50%; width:390px; max-width:100%; padding:18px 24px calc(22px + env(safe-area-inset-bottom)); border-radius:25px 25px 0 0; background:#fff; transform:translateX(-50%); }.picker-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }.picker-head b { color:var(--ink); font-size:14px; }.picker-head button { border:0; background:transparent; color:var(--berry); font-size:12px; }.wheel { position:relative; height:126px; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; border-top:1px solid #edf1f7; border-bottom:1px solid #edf1f7; }.wheel::-webkit-scrollbar { display:none; }.duration-option { display:block; width:100%; height:42px; border:0; background:transparent; color:#8c9bb0; font-size:12px; scroll-snap-align:center; }.duration-option.selected { color:var(--berry); font-weight:750; }.picker-confirm { width:100%; margin-top:15px; padding:12px; border:0; border-radius:12px; background:var(--berry); color:#fff; font-size:12px; font-weight:700; }
    .swipe-row { position:relative; margin-bottom:11px; overflow:hidden; border-radius:17px; }.swipe-row:last-child { margin-bottom:0; }.swipe-actions { position:absolute; inset:0 0 0 auto; display:flex; align-items:stretch; }.swipe-action { width:76px; border:0; color:#fff; font-size:10px; font-weight:700; }.swipe-action.status-action { background:#4d82e9; }.swipe-action.delete-action { background:#ef5c63; }.swipe-content { position:relative; z-index:1; touch-action:pan-y; transition:transform .2s ease; }.swipe-row.open .swipe-content { transform:translateX(-152px); }.swipe-row .medicine-card { margin:0; border-radius:17px; }.swipe-row .record-date { display:block; margin-top:12px; }.card-actions,.toggle-status,.delete { display:none; }
  </style>
</head>
<body>
  <div class="app">
    <header class="nav"><button class="back" id="back" aria-label="返回">‹</button><h1>用药记录</h1><button class="more" id="more" aria-label="更多操作">···</button><div class="menu" id="menu"><button id="export">导出全部记录</button><button id="clear">清空本机记录</button></div></header>
    <main>
      <section class="notice-card"><h2>记录您的用药情况</h2><p>如有用药变化，请及时更新。<br>您的记录仅供健康服务团队参考。</p><button class="entry-button" id="openSheet">＋ 填报 / 更新用药记录</button></section>
      <div class="history-head"><h2>我的用药记录</h2><span class="count" id="count">共 0 条</span></div>
      <section class="history" id="history"></section>
    </main>
  </div>
  <div class="overlay" id="overlay"><form class="sheet" id="form"><div class="handle"></div><div class="sheet-head"><h2>填报用药记录</h2><button class="close" type="button" id="close">×</button></div><label class="field">药品名称<input id="name" placeholder="例如：阿司匹林肠溶片" autocomplete="off" required></label><label class="field">剂量<input id="dose" placeholder="例如：100 mg" required></label><label class="field">用药频次<span class="frequency-select">每<select id="everyDays" aria-label="每隔多少天"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="7">7</option><option value="14">14</option><option value="30">30</option></select>天，<select id="timesPerPeriod" aria-label="每个周期多少次"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>次</span></label><label class="field">提醒时长<button class="duration-button" type="button" id="durationButton"><span id="durationValue">永久</span><span>⌄</span></button></label><label class="field">备注<textarea id="notes" rows="2" placeholder="例如：饭后服用；医嘱说明…"></textarea></label><button class="save" type="submit">保存用药记录</button><p class="sheet-notice" id="notice" aria-live="polite"></p></form></div>
  <div class="picker-overlay" id="pickerOverlay"><div class="picker-sheet"><div class="picker-head"><button type="button" id="pickerCancel">取消</button><b>选择提醒时长</b><button type="button" id="pickerConfirm">确定</button></div><div class="wheel" id="durationWheel"><button class="duration-option selected" data-value="永久">永久</button><button class="duration-option" data-value="12个月">12个月</button><button class="duration-option" data-value="6个月">6个月</button><button class="duration-option" data-value="3个月">3个月</button><button class="duration-option" data-value="1个月">1个月</button><button class="duration-option" data-value="2周">2周</button><button class="duration-option" data-value="1周">1周</button></div><button class="picker-confirm" type="button" id="pickerConfirmBottom">确认选择</button></div></div>
  <script>
    const key='medicine-log-records', seedKey='medicine-log-demo-seeded'; let records=[]; try { records=JSON.parse(localStorage.getItem(key)||'[]'); } catch { localStorage.removeItem(key); }
    if(!records.length && !localStorage.getItem(seedKey)){ records=[
      {id:'demo-aspirin',name:'阿司匹林肠溶片',dose:'100 mg',frequency:'每天 1 次',reminderDuration:'永久',status:'active',time:'2026-08-18T08:00',notes:'早餐后服用',createdAt:'2026-08-18T08:00:00.000Z'},
      {id:'demo-rosuvastatin',name:'瑞舒伐他汀钙片',dose:'10 mg',frequency:'每晚 1 次',reminderDuration:'12个月',status:'active',time:'2026-08-18T21:00',notes:'睡前服用',createdAt:'2026-08-18T21:00:00.000Z'},
      {id:'demo-metformin',name:'二甲双胍缓释片',dose:'500 mg',frequency:'每天 2 次',reminderDuration:'3个月',status:'expired',time:'2026-06-05T08:00',notes:'已按医嘱停用',createdAt:'2026-06-05T08:00:00.000Z'}
    ]; localStorage.setItem(seedKey,'1'); }
    records=records.map(record=>record.reminderDuration?record:{...record,reminderDuration:'永久'});
    const $=id=>document.getElementById(id), esc=t=>String(t||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const dateKey=v=>new Date(v).toDateString(), dateLabel=v=>new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v)).replaceAll('/','-');
    function recordCard(r){ const expired=r.status==='expired'; return `<div class="swipe-row" data-id="${r.id}"><div class="swipe-actions"><button class="swipe-action status-action" data-id="${r.id}">${expired?'恢复提醒':'标记过期'}</button><button class="swipe-action delete-action" data-id="${r.id}">删除</button></div><div class="swipe-content"><div class="medicine-card ${expired?'expired':''}"><h3>${esc(r.name)}</h3><p class="details">剂量 <b>${esc(r.dose)}</b>　|　频次 <b>${esc(r.frequency||r.method||'未填写')}</b>${r.reminderDuration?`　|　时长 <b>${esc(r.reminderDuration)}</b>`:''}</p>${r.notes?`<p class="note">${esc(r.notes)}</p>`:''}<span class="record-date">记录于 ${dateLabel(r.time||r.createdAt)}</span></div></div></div>`; }
    function enableSwipes(){ let openRow=null; const closeRow=row=>{if(row){row.classList.remove('open');row.querySelector('.swipe-content').style.transform='';}}; document.querySelectorAll('.swipe-content').forEach(content=>{let startX=0,deltaX=0,tracking=false;const row=content.closest('.swipe-row');content.addEventListener('pointerdown',event=>{tracking=true;startX=event.clientX;deltaX=0;content.setPointerCapture?.(event.pointerId);});content.addEventListener('pointermove',event=>{if(!tracking)return;deltaX=Math.min(0,event.clientX-startX);if(deltaX<0)content.style.transform=`translateX(${Math.max(-152,deltaX)}px)`;});const finish=()=>{if(!tracking)return;tracking=false;if(deltaX<-55){if(openRow&&openRow!==row)closeRow(openRow);row.classList.add('open');openRow=row;}else{closeRow(row);if(openRow===row)openRow=null;}content.style.transform='';};content.addEventListener('pointerup',finish);content.addEventListener('pointercancel',finish);});}
    function render(){ localStorage.setItem(key,JSON.stringify(records)); $('count').textContent=`共 ${records.length} 条`; if(!records.length){$('history').innerHTML='<div class="empty"><span>＋</span>还没有用药记录<br>点击上方按钮，填写第一条记录</div>';return;} const sorted=[...records].sort((a,b)=>new Date(b.time||b.createdAt)-new Date(a.time||a.createdAt)); const active=sorted.filter(r=>r.status!=='expired'), expired=sorted.filter(r=>r.status==='expired'); $('history').innerHTML=`${active.length?`<section class="record-section"><div class="record-section-head"><h3>提醒中</h3><span>${active.length} 项用药</span></div>${active.map(recordCard).join('')}</section>`:''}${expired.length?`<section class="record-section expired"><div class="record-section-head"><h3>已过期</h3><span>${expired.length} 项用药</span></div>${expired.map(recordCard).join('')}</section>`:''}`; document.querySelectorAll('.delete-action').forEach(b=>b.onclick=()=>{records=records.filter(r=>r.id!==b.dataset.id);render();}); document.querySelectorAll('.status-action').forEach(b=>b.onclick=()=>{records=records.map(r=>r.id===b.dataset.id?{...r,status:r.status==='expired'?'active':'expired'}:r);render();}); enableSwipes(); }
    let durationValue='永久', pendingDuration='永久'; function updatePicker(){ document.querySelectorAll('.duration-option').forEach(option=>option.classList.toggle('selected',option.dataset.value===pendingDuration)); } function openDurationPicker(){ pendingDuration=durationValue; updatePicker(); $('pickerOverlay').classList.add('open'); } function closeDurationPicker(){ $('pickerOverlay').classList.remove('open'); } function confirmDuration(){ durationValue=pendingDuration; $('durationValue').textContent=durationValue; closeDurationPicker(); }
    function open(){ $('overlay').classList.add('open'); $('name').focus(); } function close(){ $('overlay').classList.remove('open');$('notice').textContent=''; }
    $('openSheet').onclick=open; $('close').onclick=close; $('overlay').onclick=e=>{if(e.target===$('overlay'))close();}; $('back').onclick=()=>history.back(); $('more').onclick=()=>$('menu').classList.toggle('open'); $('durationButton').onclick=openDurationPicker; $('pickerCancel').onclick=closeDurationPicker; $('pickerConfirm').onclick=confirmDuration; $('pickerConfirmBottom').onclick=confirmDuration; $('pickerOverlay').onclick=e=>{if(e.target===$('pickerOverlay'))closeDurationPicker();}; document.querySelectorAll('.duration-option').forEach(option=>option.onclick=()=>{pendingDuration=option.dataset.value;updatePicker();});
    $('form').onsubmit=e=>{e.preventDefault();const now=new Date();const frequency=`每 ${$('everyDays').value} 天 ${$('timesPerPeriod').value} 次`;records.push({id:crypto.randomUUID(),name:$('name').value.trim(),dose:$('dose').value.trim(),frequency,reminderDuration:durationValue,status:'active',time:now.toISOString().slice(0,16),notes:$('notes').value.trim(),createdAt:now.toISOString()});e.target.reset();$('everyDays').value='1';$('timesPerPeriod').value='1';render();$('notice').textContent='已保存';setTimeout(close,350);};
    function exportData(){if(!records.length){$('menu').classList.remove('open');return;}const rows=[['用药时间','药品名称','剂量','频次','提醒时长','状态','备注'],...records.map(r=>[r.time,r.name,r.dose,r.frequency||r.method||'',r.reminderDuration||'永久',r.status==='expired'?'已过期':'提醒中',r.notes])];const link=document.createElement('a');link.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));link.download=`用药记录-${new Date().toLocaleDateString('zh-CN')}.csv`;link.click();URL.revokeObjectURL(link.href);$('menu').classList.remove('open');}
    $('export').onclick=exportData; $('clear').onclick=()=>{if(confirm('确定清空这台设备上的全部用药记录吗？')){records=[];render();$('menu').classList.remove('open');}};render();
  </script>
</body>
</html>
